name: OLP XDV trend atlas

# Every market's trend league by league, team by team, season by season, for all of football, tested: does it repeat,
# and does it beat SportyBet's price (worldwide) and the bookmakers' average price (ten seasons)?
# engine/trend_atlas.py + backtest/trend_atlas_study.py. RECORD ONLY. Weekly + manual.
on:
  # schedule: none - the Oracle VM clock starts this (matchbook-agent oracle_clock/schedule.json)
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write     # a new EDGE CANDIDATE opens one build issue (monitor/edge_candidates.py)

concurrency:
  group: trend-atlas
  cancel-in-progress: false

jobs:
  facts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Check out the private data (Tolar07/framework-data)
        uses: actions/checkout@v7
        with:
          repository: Tolar07/framework-data
          ssh-key: ${{ secrets.FRAMEWORK_DATA_KEY }}
          path: .fdata
          fetch-depth: 1
      - name: Lay the private data over the workspace (monitor/fdata.py)
        env:
          FDATA_SOURCE: ${{ vars.FDATA_SOURCE }}
        run: python3 monitor/fdata.py pull
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install what the feed reader needs
        run: pip install -q requests numpy
      - name: Run
        env:
          PYTHONIOENCODING: utf-8
        run: python backtest/trend_atlas_study.py
      - name: Hand new edge candidates to the builder (monitor/edge_candidates.py)
        env:
          PYTHONIOENCODING: utf-8
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python monitor/edge_candidates.py
      - name: Save to the private data (framework-data)
        if: always()
        run: python3 monitor/fdata.py save "trend-atlas $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]" backtest/TREND_ATLAS_STUDY.md output/trend_atlas memory/edge_candidates_seen.json || true
