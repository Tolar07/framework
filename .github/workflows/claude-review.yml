name: Claude code review

# Every pull request gets a Claude review before it is merged (Architect
# 2026-10-04: put the agents to work), using the code-reviewer and
# olp-xdv-07-compliance agents' brief: correctness, the standing orders,
# HR35/HR59, the capital bright line.
#
# NEEDS ONE SECRET to switch on: ANTHROPIC_API_KEY (an Anthropic API key) or
# CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token` on a Claude plan). Until
# one is set this workflow does nothing and passes.
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: No Claude key set — skipping review
        if: env.HAS_KEY != 'true'
        run: echo "Set ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN to switch on Claude reviews."
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        if: env.HAS_KEY == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            Review this pull request for the OLP XDV framework. Read CLAUDE.md,
            STANDING_ORDERS.md and .claude/agents/code-reviewer.md and
            .claude/agents/olp-xdv-07-compliance.md first. Report only real
            problems: bugs, a standing order reverted or weakened without the
            Architect's instruction, HR35 (missing data shown as PENDING, never
            filled) and HR59 (traceable output) breaches, and anything that
            touches the capital bright line. Use inline comments for
            code-specific findings; say plainly when there is nothing to fix.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
