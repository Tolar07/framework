name: OLP XDV nightly match study

# Architect 2026-10-26: "the framework needs to study each match. The ones that
# we bet and the one that we do not bet ... understand the tactics, understand
# the formation, understand how each tactics interacts with each other".
#
# Every finished match of the covered competitions is read from FotMob
# (data/match_study.py), every team's tactical profile is rebuilt with it
# (engine/tactics.py -> data/tactics/profiles.json, read by the 21:47 and 06:47
# boards), each match is explained against what the profiles expected
# (memory/match_study_log.jsonl), and lessons are tested on matches they had
# not seen (memory/tactics_lessons.json). Twice a night, off the hour (GitHub
# drops :00 ticks); the second run picks up late finishes and a dropped first.
on:
  schedule:
    - cron: "23 1 * * *"
    - cron: "37 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: match-study
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Study every finished match + rebuild the tactical profiles
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: python monitor/match_study_run.py

      - name: Save
        run: |
          git config user.name  "olp-xdv-agent"
          git config user.email "olp-xdv-agent@users.noreply.github.com"
          git add data/match_study data/tactics memory/tactics_lessons.json memory/match_study_log.jsonl memory/why_record.jsonl backtest/TACTICS_STUDY.md || true
          if git diff --staged --quiet; then
            echo "::warning::match study: nothing new"
            exit 0
          fi
          git commit -q -m "match study + tactical profiles $(date -u +%Y-%m-%d) [skip ci]"
          for i in 1 2 3 4; do
            if ! git pull --rebase -q origin main; then
              git rebase --abort || true
              echo "::warning::match study: main moved and a file conflicted — not saved"
              exit 0
            fi
            git push -q origin HEAD:main && echo "match study saved to main" && exit 0
            sleep $((i * 5))
          done
          echo "::error::match study: push failed after 4 tries"
          exit 1
