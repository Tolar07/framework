name: OLP XDV pre-kickoff team news

# Improvement #2 (Architect 2026-10-02): re-check every pick against the
# CONFIRMED lineup ~1 hour before kickoff and alert on Telegram when the team a
# pick depends on is weakened or rotated. Every 20 minutes, 09:00-20:40 UTC
# (10:00-21:40 Lagos), when kickoffs happen. Light job: stdlib + requests.
on:
  schedule:
    - cron: "*/20 9-20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: olp-xdv-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check confirmed lineups for upcoming picks
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING:   utf-8
        run: |
          pip install -q requests
          python3 news_check.py
      - name: Persist lineup checks
        run: |
          git config user.name  "olp-xdv-agent"
          git config user.email "olp-xdv-agent@users.noreply.github.com"
          git add output/picks 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git commit -m "lineup check $(date -u +%H:%M) [skip ci]"
          git pull --rebase -q origin main || true
          git push || echo "nothing to push"
