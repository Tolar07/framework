name: OLP XDV nightly retrain

# Architect 2026-10-20 ("auto"): every night the model's calibration (BTTS,
# Over 1.5 / 2.5 / 3.5) is refitted on every graded rated fixture — picked or
# not — and goes live BY ITSELF only where it beats the live calibration on the
# newest games, which it was not fitted on (engine/retrain.py). No /approve.
# Chances only: stakes, gates and leagues are untouched.
#
# 03:31 UTC: clear of daily.yml (20:47 / 05:47) and off the hour (GitHub drops :00 ticks).
# 04:43 and 05:13 UTC are backups (Architect 2026-10-21): GitHub dropped the 03:31 tick
# on 21 Oct. A scheduled run skips when the retrain already ran that UTC day, so the
# backups only run when the 03:31 one never started; all still land before the 05:47 board.
on:
  # schedule: none - the Oracle VM clock starts this (matchbook-agent oracle_clock/schedule.json)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: retrain
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check out the private data (Tolar07/framework-data)
        # not fatal while framework still holds the data: no key = today's behaviour
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: Tolar07/framework-data
          ssh-key: ${{ secrets.FRAMEWORK_DATA_KEY }}
          path: .fdata
          fetch-depth: 1
      - name: Lay the private data over the workspace (monitor/fdata.py)
        env:
          FDATA_SOURCE: ${{ vars.FDATA_SOURCE }}   # unset: framework's copy; fd: framework-data's
        run: python3 monitor/fdata.py pull

      - name: Already ran today?
        id: once
        if: github.event_name == 'schedule'
        run: |
          if grep -q "\"at\": \"$(date -u +%Y-%m-%d)T" memory/retrain_log.jsonl 2>/dev/null; then
            echo "retrain already ran today (UTC): this backup run does nothing"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.once.outputs.skip != '1'
        with:
          python-version: "3.12"

      - name: Install
        if: steps.once.outputs.skip != '1'
        run: pip install -q -r requirements.txt

      - name: Refit and gate
        if: steps.once.outputs.skip != '1'
        env:
          PYTHONIOENCODING: utf-8
        run: python monitor/retrain_run.py --message-file "$RUNNER_TEMP/retrain_msg.txt"

      - name: NBA refit and gate (recorded only, engine/nba_recal.py)
        if: steps.once.outputs.skip != '1'
        env:
          PYTHONIOENCODING: utf-8
        run: python engine/nba_recal.py || echo "NBA refit failed — football retrain unaffected"

      - name: Save
        if: steps.once.outputs.skip != '1'
        run: |
          git config user.name  "olp-xdv-agent"
          git config user.email "olp-xdv-agent@users.noreply.github.com"
          python3 monitor/fdata.py save "retrain $(date -u +%Y-%m-%d) [skip ci]" memory/retrain_log.jsonl memory/calibration_live.json memory/nba_retrain_log.jsonl memory/nba_calibration_live.json data/nba_lineups
          git add memory/retrain_log.jsonl memory/calibration_live.json
          git add memory/nba_retrain_log.jsonl memory/nba_calibration_live.json data/nba_lineups 2>/dev/null || true
          if git diff --staged --quiet; then echo "retrain files unchanged"; exit 0; fi
          git commit -q -m "retrain $(date -u +%Y-%m-%d) [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase --autostash -q origin main && git push -q origin HEAD:main; then
              echo "retrain saved to main"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::retrain: could not save to main after 3 tries"
          exit 1

      - name: Tell the Architect
        if: steps.once.outputs.skip != '1'
        env:
          PYTHONIOENCODING: utf-8
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor/retrain_run.py --send "$RUNNER_TEMP/retrain_msg.txt"
