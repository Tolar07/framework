name: Vault-Memory Sync Health Check

on:
  push:
    branches: [main]
    paths:
      - 'docs/obsidian-vault/**'
      - '.claude/projects/C--Users-Motunrayo-omniroute-test/memory/**'
  pull_request:
    branches: [main]
    paths:
      - 'docs/obsidian-vault/**'
      - '.claude/projects/C--Users-Motunrayo-omniroute-test/memory/**'
  schedule:
    # Daily at 06:30 UTC (avoids :00/:30 cache collisions)
    - cron: '30 6 * * *'

jobs:
  sync-health:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./olp_xdv_agent/olp_xdv
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts 2>/dev/null || true

      - name: Run vault-memory sync status
        id: sync-status
        run: |
          node .claude/scripts/hooks/vault-memory-sync.js status
          # Capture the summary line for decision
          SYNC_OUTPUT=$(node .claude/scripts/hooks/vault-memory-sync.js status 2>&1)
          echo "$SYNC_OUTPUT"
          # Extract diverged count
          DIVERGED=$(echo "$SYNC_OUTPUT" | grep -oP 'Summary: \d+ in sync, \K\d+' || echo "0")
          echo "diverged=$DIVERGED" >> $GITHUB_OUTPUT

      - name: Fail on divergence
        if: steps.sync-status.outputs.diverged != '0'
        run: |
          echo "::error::Vault-memory sync has ${{ steps.sync-status.outputs.diverged }} diverged file(s)!"
          echo "Run 'node .claude/scripts/hooks/vault-memory-sync.js reconcile' locally to resolve."
          exit 1

      - name: Sync health passed
        if: steps.sync-status.outputs.diverged == '0'
        run: |
          echo "✅ Vault-memory sync healthy: 0 diverged files"