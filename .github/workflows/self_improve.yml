name: OLP XDV weekly self-improvement

# Architect 2026-10-28: "the autonomous engine should be asking, what do I need
# to do better? How can I improve things? And an answer should be provided to it."
#
# review (no LLM): re-runs the inputs study (H2H / form / xG walk-forward),
#   audits the model's inputs against what strong football models use, checks
#   every learning loop for tested evidence this week, ranks what to do better
#   and opens each top proposal as a `self-improvement` issue
#   (scripts/self_improve.py -> backtest/SELF_IMPROVEMENT.md).
# build (fresh Claude Code run on Sonnet, nothing persistent): asks what it
#   must do better, searches what strong models use, opens what's lacking as
#   issues, builds the top one RECORD-ONLY or as a SHADOW with tests, merges
#   it on green, and sends the Architect a plain summary. It never changes a
#   pick, stake or threshold (order 49).
on:
  # schedule: none - the Oracle VM clock starts this (matchbook-agent oracle_clock/schedule.json)
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: self-improve
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Check out the private data (Tolar07/framework-data)
        # not fatal while framework still holds the data: no key = today's behaviour
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: Tolar07/framework-data
          ssh-key: ${{ secrets.FRAMEWORK_DATA_KEY }}
          path: .fdata
          fetch-depth: 1
      - name: Lay the private data over the workspace (monitor/fdata.py)
        env:
          FDATA_SOURCE: ${{ vars.FDATA_SOURCE }}   # unset: framework's copy; fd: framework-data's
        run: python3 monitor/fdata.py pull
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Re-test the candidate inputs walk-forward
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: python backtest/inputs_study.py > /dev/null
      - name: What do I need to do better?
        env:
          PYTHONIOENCODING: utf-8
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/self_improve.py --issues | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save
        run: |
          git config user.name  "olp-xdv-agent"
          git config user.email "olp-xdv-agent@users.noreply.github.com"
          python3 monitor/fdata.py save "weekly self-improvement review $(date -u +%Y-%m-%d) [skip ci]" memory/self_improvement.json memory/inputs_gate.json
          git add backtest/SELF_IMPROVEMENT.md memory/self_improvement.json backtest/INPUTS_STUDY.md memory/inputs_gate.json || true
          if git diff --staged --quiet; then exit 0; fi
          git commit -q -m "weekly self-improvement review $(date -u +%Y-%m-%d) [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase -q origin main || { git rebase --abort || true; echo "::warning::not saved"; exit 0; }
            git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "::error::self-improvement review: push failed after 4 tries"
          exit 1

  build:
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: No Claude key set — skipping the build
        if: env.HAS_KEY != 'true'
        run: echo "Set ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN to let the weekly review build its top proposal."
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
        with:
          ref: main
      - uses: anthropics/claude-code-action@v1
        if: env.HAS_KEY == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            You are the OLP XDV engine's weekly self-improvement step (STANDING_ORDERS
            order 49). Read CLAUDE.md, STANDING_ORDERS.md and backtest/SELF_IMPROVEMENT.md
            first. Work through the four steps below; keep tool output small.

            1. ASK: "What do I need to do to improve performance and the framework?"
            2. SEARCH: use WebSearch / WebFetch for what strong football (and NBA) prediction
               models use now: inputs, methods, calibration, data sources. Compare that with
               section (a) of backtest/SELF_IMPROVEMENT.md and the code. For anything that is
               lacking and not already an open `self-improvement` issue, open one
               (`gh issue create --label self-improvement`) with the source URL, why it should
               help and how to test it walk-forward. At most 3 new issues a week.
            3. BUILD: take the highest-ranked OPEN `self-improvement` issue with no open PR
               (`gh pr list --search "<issue number>"`) and build it SAFELY:
               - RECORD-ONLY (capture data / write a study) or a SHADOW (a candidate
                 evaluated walk-forward next to the live model, like
                 backtest/inputs_study.py or engine/why_learning.py);
               - never change a pick rule, stake, staking, threshold, the CLV gate,
                 ARCHITECT_SIGNOFF or anything the capital bright line covers;
               - add a test under tests/ and run it plus the tests of every file you touched;
               - missing data reads PENDING (HR35); never invent fixtures or prices (HR59).
               Push a branch `self-improve/<issue number>` and open a PR that says
               "Closes #<issue number>", what was built and the numbers it produced.
               If the top issue is a stalled learning loop, find the cause at source and fix it.
            4. MERGE (Architect 2026-10-28: an unmerged PR can be lost): wait for its checks
               with `gh pr checks <pr> --watch`. Green -> `gh pr merge <pr> --squash --delete-branch`.
               Red -> read the failing log, fix, push, and try again (up to 3 rounds). If it still
               fails, comment on the PR with exactly what fails and leave it open.
            Finally write a SHORT plain-English summary for the Architect to
            /tmp/architect_note.txt: the question, what you found lacking, the proposals
            (issue numbers), what you built and merged (PR number) and its numbers. No jargon.
          claude_args: |
            --model claude-sonnet-5-5
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(python:*),Bash(git:*),Bash(gh issue:*),Bash(gh pr:*),Bash(gh run:*),Bash(pip install:*)"
      - name: Run it by the Architect (Telegram, his chat only)
        if: always() && env.HAS_KEY == 'true'
        env:
          PYTHONIOENCODING: utf-8
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          pip install -q requests
          python scripts/self_improve.py --telegram /tmp/architect_note.txt
