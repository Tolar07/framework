name: OLP XDV daily board

# Nigeria is UTC+1 year-round (no DST), so Africa/Lagos = UTC+1. GitHub cron is
# always UTC. Two runs a day (Architect's request 2026-09-30):
#   ~21:47 Lagos (20:47 UTC) — EVENING: prepare the next match day's board.
#   ~06:47 Lagos (05:47 UTC) — MORNING: refresh with the latest prices/lineups.
# Deliberately OFF the top of the hour: GitHub delays and sometimes DROPS
# scheduled runs under the :00 load spike (2026-09-30: the 21:00 run fired 3.5h
# late and the 06:00 run never fired). Firing at :47 also lands the board just
# before 10 PM / 7 AM Lagos.
on:
  schedule:
    - cron: "47 20 * * *"   # ~21:47 Africa/Lagos — evening prep run
    - cron: "47 5 * * *"    # ~06:47 Africa/Lagos — morning refresh run
  workflow_dispatch:        # manual trigger (e.g. to send a given day's board now)
    inputs:
      target_date:
        description: "Build the board for this day (YYYY-MM-DD). Blank = today."
        required: false
        default: ""
      slot:
        description: "evening | morning = scheduled slot (sent at most once per day); manual = always send"
        required: false
        default: "manual"

# Needed so the run can commit the CLV log back — without persistence the
# paper log resets every run and the Phase 3 gate can never accumulate.
permissions:
  contents: write

concurrency:
  group: olp-xdv-daily
  cancel-in-progress: false   # never kill a run mid-write of the CLV log

jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Football-Data CSVs and fitted models are expensive to refetch/refit.
      # Keyed by day so the cache rolls over rather than going stale forever.
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: |
            data/cache
            backtest/cache
          key: olp-xdv-data-${{ github.run_id }}
          restore-keys: olp-xdv-data-

      - name: Run the daily board
        env:
          ODDS_API_KEY:       ${{ secrets.ODDS_API_KEY }}
          THESPORTSDB_KEY:    ${{ secrets.THESPORTSDB_KEY }}
          # Fixtures + results fallback. Without this the run reports
          # "API_FOOTBALL_KEY environment variable not set" and can't fall back
          # to API-Football when the odds API is exhausted or TheSportsDB lacks
          # a league. Harmless while the secret is unset — the key is empty and
          # the code degrades to NO DATA — PENDING exactly as before.
          API_FOOTBALL_KEY:   ${{ secrets.API_FOOTBALL_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional: a separate Architect-only chat for the bet365 board
          # (standing order 29). Unset = TELEGRAM_CHAT_ID, the Architect's chat.
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          # Subscribers (order 33): comma-separated chat ids that get everything
          # the Architect gets — board, heartbeat, alerts — except the bet365 board.
          TELEGRAM_SUBSCRIBER_CHAT_IDS: ${{ secrets.TELEGRAM_SUBSCRIBER_CHAT_IDS }}
          PYTHONIOENCODING:   utf-8
          SCHEDULE:           ${{ github.event.schedule }}
          TARGET_DATE_INPUT:  ${{ github.event.inputs.target_date }}
          SLOT_INPUT:         ${{ github.event.inputs.slot }}
        # TELEGRAM DELIVERY ON — production board + daily heartbeat (Architect's
        # request 2026-09-30). --only-production sends the canonical board ONLY on
        # days with real picks; --heartbeat sends a short 'system alive' ping
        # EVERY day. The EVENING run targets TOMORROW's
        # fixtures (--next-day); the morning run builds today's card. Manual
        # dispatches build today's by default.
        # Every run is pinned to ONE day's card: the evening run -> tomorrow,
        # the morning run -> today, a manual dispatch -> its target_date input
        # (default today). Inputs pass via env and are format-checked, never
        # interpolated into the shell directly.
        # DUPLICATE GUARD (2026-10-02): the board is started on time by a daily
        # Routine (workflow_dispatch with slot=evening/morning) AND by the GitHub
        # crons below as a backup. GitHub fires its crons hours late or not at
        # all, so whichever arrives second for the same day + slot is skipped:
        # a marker output/boards/sent_<date>_<slot> is committed after delivery
        # and checked against the LATEST main (not this run's checkout SHA).
        # slot=manual (the default for hand dispatches) always sends.
        run: |
          if [ "$SCHEDULE" = "47 20 * * *" ]; then
            SLOT=evening
            # Evening run builds TOMORROW's card. If GitHub fired it so late it
            # is already past midnight UTC, "tomorrow" has become today — build
            # today's card instead of jumping a day ahead (2026-10-01 incident).
            if [ "$(date -u +%H)" -ge 12 ]; then T=$(date -u -d tomorrow +%F); else T=$(date -u +%F); fi
          elif [ "$SCHEDULE" = "47 5 * * *" ]; then
            SLOT=morning
            T=$(date -u +%F)
          else
            SLOT="${SLOT_INPUT:-manual}"
            T="${TARGET_DATE_INPUT:-$(date -u +%F)}"
          fi
          if ! [[ "$T" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "invalid target_date '$T' (want YYYY-MM-DD)"; exit 1
          fi
          if ! [[ "$SLOT" =~ ^(evening|morning|manual)$ ]]; then
            echo "invalid slot '$SLOT' (want evening|morning|manual)"; exit 1
          fi
          MARKER="output/boards/sent_${T}_${SLOT}"
          if [ "$SLOT" != "manual" ]; then
            git fetch -q origin main
            if git cat-file -e "origin/main:$MARKER" 2>/dev/null; then
              echo "SKIP: the $SLOT board for $T was already delivered ($MARKER) — no duplicate send."
              exit 0
            fi
          fi
          ARGS="--only-production --heartbeat --target-date $T"
          echo "schedule='$SCHEDULE' slot=$SLOT -> run_daily.py $ARGS"
          python run_daily.py $ARGS
          if [ "$SLOT" != "manual" ]; then
            date -u +%FT%TZ > "$MARKER"
          fi

      # The CLV log IS the Phase 2 evidence. Committing it back is what makes
      # the gate cumulative across runs rather than starting from zero daily.
      - name: Persist the CLV log and board
        run: |
          git config user.name  "olp-xdv-agent"
          git config user.email "olp-xdv-agent@users.noreply.github.com"
          git add clv/clv_log.json output/boards memory/ || true
          # Picks ledger (what the board recommended + its graded results).
          git add output/picks 2>/dev/null || true
          # AI Survivor lineage (population + every pick, graded in place).
          git add data/survivor 2>/dev/null || true
          git diff --staged --quiet || git commit -m "daily board $(date -u +%Y-%m-%d) [skip ci]"
          # A queued run checks out an older SHA; rebase onto latest main first.
          git pull --rebase -q origin main || true
          git push || echo "nothing to push"

      # Failure alert RE-ENABLED (2026-09-30) now that this framework is corrected
      # and re-adopted as canonical. A failed run is an operational alert, not
      # paper-calibration noise — it fires only on failure() so the phone hears
      # about a broken run (no board) but nothing else.
      # The Architect's chat and every subscriber chat (order 33). The reply is
      # discarded: it names the chat, and this public repo's run logs are public.
      - name: Report failure to Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_SUBSCRIBER_CHAT_IDS: ${{ secrets.TELEGRAM_SUBSCRIBER_CHAT_IDS }}
        run: |
          MSG="OLP XDV: a scheduled run FAILED. No board from this run — this is a system failure, not a quiet slate. Run log: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          for CID in $(printf '%s\n' "${TELEGRAM_CHAT_ID}" ${TELEGRAM_SUBSCRIBER_CHAT_IDS//,/ } | awk 'NF && !seen[$1]++'); do
            curl -s -o /dev/null -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${CID}" --data-urlencode text="${MSG}" || true
          done
