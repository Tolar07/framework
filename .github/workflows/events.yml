name: OLP XDV match events

# Football match events for today's and tomorrow's rated fixtures (framework #555): cards, red card, fouls,
# corners, shots, shots on target, anchored to the board's own expected goals; and the grade of past days.
# monitor/events_run.py, engine/event_model.py, evidence backtest/EVENT_MODEL_STUDY.md.
# RECORDED ONLY (shadow): nothing here picks, stakes or blocks. Read by the Control Room app's match pages.
on:
  # schedule: none - the Oracle VM clock starts this (matchbook-agent oracle_clock/schedule.json)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: events
  cancel-in-progress: false

jobs:
  events:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Check out the private data (Tolar07/framework-data)
        uses: actions/checkout@v7
        with:
          repository: Tolar07/framework-data
          ssh-key: ${{ secrets.FRAMEWORK_DATA_KEY }}
          path: .fdata
          fetch-depth: 1
      - name: Lay the private data over the workspace (monitor/fdata.py)
        env:
          FDATA_SOURCE: ${{ vars.FDATA_SOURCE }}
        run: python3 monitor/fdata.py pull
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Re-run the walk-forward study (decides which counts are published; about 10 s)
        env:
          PYTHONIOENCODING: utf-8
        run: python backtest/event_study.py
      - name: Predict and grade
        env:
          PYTHONIOENCODING: utf-8
        run: python monitor/events_run.py
      - name: Game-state study (framework #566, shadow; does the xG gap tie cards, corners, passes to the goals model)
        env:
          PYTHONIOENCODING: utf-8
        run: python backtest/event_xg_study.py || true
      - name: Player predictions and grade (framework #557, shadow; PENDING until the study has 4 weeks of players)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python backtest/player_study.py || true
          python monitor/players_run.py || true
      - name: Basketball player events and grade (framework #558, shadow; nothing published until the study lets a stat through)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python backtest/basketball_events_study.py || true
          python monitor/basketball_events_run.py || true
      - name: Tennis match events and grade (framework #559, shadow; set scores, total games, tie-break)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python backtest/tennis_events_study.py || true
          python monitor/tennis_events_run.py || true
      - name: Ice hockey events study (framework #586, shadow; goals and shots per period, team totals)
        env:
          PYTHONIOENCODING: utf-8
        run: python backtest/hockey_events_study.py || true
      - name: Baseball events study (framework #587, shadow; runs per inning, first five innings, team totals)
        env:
          PYTHONIOENCODING: utf-8
        run: python backtest/baseball_events_study.py || true
      - name: NFL events study (framework #588, shadow; quarter totals, half totals, team points)
        env:
          PYTHONIOENCODING: utf-8
        run: python backtest/nfl_events_study.py || true
      - name: Cricket events study (framework #589, shadow; total runs, over-block runs, wickets)
        env:
          PYTHONIOENCODING: utf-8
        run: python backtest/cricket_events_study.py || true
      - name: Snooker events study (framework #590, shadow; correct score, total frames)
        env:
          PYTHONIOENCODING: utf-8
        run: python backtest/snooker_events_study.py || true
      - name: Darts events study (framework #592, shadow; correct score in legs, total legs)
        env:
          PYTHONIOENCODING: utf-8
        run: python backtest/darts_events_study.py || true
      - name: Volleyball events study (framework #591, shadow; set totals, set handicap, total points)
        env:
          PYTHONIOENCODING: utf-8
        run: python backtest/volleyball_events_study.py || true
      - name: Rugby events study (framework #593, shadow; first-half total points, tries, penalty goals)
        env:
          PYTHONIOENCODING: utf-8
        run: python backtest/rugby_events_study.py || true
      - name: Save to the private data (framework-data)
        if: always()
        run: python3 monitor/fdata.py save "match events $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]" output/events output/players output/basketball_events output/tennis_events backtest/tennis_events_fit.json backtest/TENNIS_EVENTS_STUDY.md backtest/HOCKEY_EVENTS_STUDY.md backtest/BASEBALL_EVENTS_STUDY.md backtest/NFL_EVENTS_STUDY.md backtest/CRICKET_EVENTS_STUDY.md backtest/SNOOKER_EVENTS_STUDY.md backtest/DARTS_EVENTS_STUDY.md backtest/RUGBY_EVENTS_STUDY.md backtest/VOLLEYBALL_EVENTS_STUDY.md backtest/EVENT_MODEL_STUDY.md backtest/EVENT_XG_STUDY.md backtest/PLAYER_MODEL_STUDY.md backtest/BASKETBALL_EVENTS_STUDY.md data/nba_lineups/player_stats.jsonl || true
