name: OLP XDV weekly review

# The olp-xdv-10-ceo agent's weekly results review (Architect 2026-10-04: put
# the agents to work). Every Monday 07:51 UTC (08:51 UK in summer), scripts/weekly_review.py
# reads the graded picks ledger for the last 7 days and sends one Telegram
# report: results by market family and league (worst first), every slip kind
# landed, the learning corrections in force, and proposals for the Architect.
# Also builds the CLV scorecard (scripts/clv_scorecard.py) and saves it to
# output/scorecard/latest.txt, which the PC's WhatsApp mirror posts on Mondays.
# Read-only: nothing is changed automatically.
on:
  # schedule: none - the Oracle VM clock starts this (matchbook-agent oracle_clock/schedule.json)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests numpy scipy   # the losing-market watch reads market keys (order 39)
      - name: Weekly results review
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/weekly_review.py
      - name: Save the CLV scorecard for the WhatsApp mirror
        run: |
          python scripts/clv_scorecard.py > /dev/null
          git config user.name "olp-xdv-bot"
          git config user.email "bot@users.noreply.github.com"
          git add output/scorecard/latest.txt
          git diff --cached --quiet && exit 0
          git commit -q -m "CLV scorecard $(date -u +%Y-%m-%d) [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase -q origin main && git push -q origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::scorecard: could not save to main"; exit 1
