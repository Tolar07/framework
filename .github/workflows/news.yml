name: OLP XDV pre-kickoff team news

# Improvement #2 (Architect 2026-10-02): re-check every pick against the
# CONFIRMED lineup ~1 hour before kickoff, alert on price drift, and record
# each pick's closing price (orders 17, 20, 25). Every 20 minutes,
# 09:00-20:40 UTC (10:00-21:40 Lagos), when kickoffs happen.
#
# ONE job loops through the day (monitor/news_loop.py): GitHub dropped the old
# 20-minute cron almost every time (6 runs in three days, 2026-10-04 audit).
# daily.yml starts the loop after each board; the cron ticks below are only a
# backup starter — a run that finds the loop already going exits at once. A
# job may run 6 hours at most, so the loop hands off to a fresh run.
on:
  schedule:
    - cron: "5 9,11,13,15,17,19 * * *"
  workflow_dispatch:
    inputs:
      handoff:
        description: "true = started by the previous loop run (internal)"
        required: false
        default: "false"

permissions:
  actions: write    # see whether a loop is already running; hand off to a fresh run
  contents: write   # save lineup checks, drift and closing prices

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Check lineups, price drift and closing prices every 20 minutes
        env:
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING:   utf-8
          HANDOFF:            ${{ github.event.inputs.handoff }}
        run: |
          pip install -q requests
          git config user.name  "olp-xdv-agent"
          git config user.email "olp-xdv-agent@users.noreply.github.com"
          if [ "$HANDOFF" = "true" ]; then python3 monitor/news_loop.py --handoff
          else python3 monitor/news_loop.py; fi
