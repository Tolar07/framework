name: OLP XDV tip sites (paper)

# Architect 2026-11-03: the scouting side also reads the free daily tips of football prediction sites, so
# they are graded and studied (engine/tip_sites.py). Paper only: nothing here picks or stakes.
# Reads tips before kick-off, grades finished ones on Flashscore, rewrites data/tip_sites/TIP_SITES_STUDY.md.
on:
  # schedule: none - the Oracle VM clock starts this (matchbook-agent oracle_clock/schedule.json)
  workflow_dispatch:

permissions:
  contents: write   # save the tips, grades and the study

concurrency:
  group: tip-sites
  cancel-in-progress: false

jobs:
  tips:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Read, grade, study
        env:
          PYTHONIOENCODING: utf-8
        run: python monitor/tip_sites_run.py
      - name: Commit the tips back
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name  "olp-xdv-agent"
          git config user.email "olp-xdv-agent@users.noreply.github.com"
          git add data/tip_sites
          git diff --staged --quiet && exit 0
          git commit -q -m "tip sites: tips, grades and study $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && exit 0; sleep 5; done
          exit 1
