name: OLP XDV universe sweep

# Every SportyBet football and basketball game, covered or not (Architect
# 2026-10-07: learn "how the game is played, how the betting goes on them"):
# every 3 hours read the whole upcoming list (first/last price per game),
# grade finished games from Flashscore and archive them; the study is
# rewritten once a day. monitor/universe_sweep.py, engine/universe.py.
#
# Prices of games not yet played are kept in the Actions cache (not git);
# a game reaches git once, graded, in data/universe/graded_<month>.jsonl.
# A dropped GitHub cron only delays grading: the next sweep catches up.
on:
  # schedule: none - the Oracle VM clock starts this (matchbook-agent oracle_clock/schedule.json)
  workflow_dispatch: {}

permissions:
  contents: write   # save graded games and the study

concurrency:
  group: universe
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check out the private data (Tolar07/framework-data)
        # not fatal while framework still holds the data: no key = today's behaviour
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: Tolar07/framework-data
          ssh-key: ${{ secrets.FRAMEWORK_DATA_KEY }}
          path: .fdata
          fetch-depth: 1
      - name: Lay the private data over the workspace (monitor/fdata.py)
        env:
          FDATA_SOURCE: ${{ vars.FDATA_SOURCE }}   # unset: framework's copy; fd: framework-data's
        run: python3 monitor/fdata.py pull
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Restore the ungraded games and Flashscore cache
        uses: actions/cache@v4
        with:
          path: |
            data/cache/universe
            data/cache/flashscore
          key: olp-xdv-universe-${{ github.run_id }}
          restore-keys: olp-xdv-universe-
      - name: Sweep, grade, archive
        env:
          PYTHONIOENCODING: utf-8
          # the morning paper-book note goes to the Architect's own chat only
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
        run: |
          git config user.name  "olp-xdv-agent"
          git config user.email "olp-xdv-agent@users.noreply.github.com"
          python monitor/universe_sweep.py
