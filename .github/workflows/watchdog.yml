name: OLP XDV missed-run watchdog

# daily.yml alerts when a board run FAILS. This catches the silent case: a
# scheduled run GitHub delayed or dropped (2026-09-30: the 06:00 run never
# fired). ~2.5 h after each board slot it checks that some daily.yml run
# succeeded in the slot's window; if none did (and none failed or is still
# going) it starts the slot's board itself and says so on Telegram.
on:
  # schedule: none - the Oracle VM clock starts this (matchbook-agent oracle_clock/schedule.json)
  workflow_dispatch:
    inputs:
      slot:
        description: "evening | morning"
        required: true
        default: "evening"

permissions:
  actions: write    # read daily.yml's runs; start a missed slot's board
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check out the private data (Tolar07/framework-data)
        # not fatal while framework still holds the data: no key = today's behaviour
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: Tolar07/framework-data
          ssh-key: ${{ secrets.FRAMEWORK_DATA_KEY }}
          path: .fdata
          fetch-depth: 1
      - name: Lay the private data over the workspace (monitor/fdata.py)
        env:
          FDATA_SOURCE: ${{ vars.FDATA_SOURCE }}   # unset: framework's copy; fd: framework-data's
        run: python3 monitor/fdata.py pull
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests
      - name: Check the slot's board run
        env:
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          SCHEDULE:           ${{ github.event.schedule }}
          SLOT_INPUT:         ${{ github.event.inputs.slot }}
        run: |
          case "$SCHEDULE" in
            "23 21 * * *"|"23 22 * * *"|"17 23 * * *") SLOT=evening ;;
            "23 6 * * *"|"23 7 * * *"|"17 8 * * *")    SLOT=morning ;;
            *) SLOT="${SLOT_INPUT:-evening}" ;;
          esac
          if ! [[ "$SLOT" =~ ^(evening|morning)$ ]]; then echo "invalid slot '$SLOT'"; exit 1; fi
          python monitor/run_watchdog.py --slot "$SLOT"
