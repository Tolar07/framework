# Full test suite — runs on every push + PR, separate from the daily board job.
# This workflow is strictly tests; it does NOT write CLV logs back to the repo.

name: OLP XDV test suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: olp-xdv-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit + integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff mypy pytest

      - name: Lint (ruff — observability closure)
        # Gate scope mirrors the mypy gate: a green check on the load-bearing
        # observability modules the Phase-8 work owns. The rest of the repo
        # carries a legacy lint baseline (ruff check . ≈ 1k findings) — a
        # codebase-wide cleanup is out of scope for CI.
        run: python -m ruff check monitor/data_quality.py monitor/json_log.py monitor/metrics.py tests/monitor_metrics_test.py tests/monitor_json_log_test.py

      - name: Type check (mypy gate scope)
        run: python -m mypy --config-file pyproject.toml

      - name: Tests (each file in its own process)
        # The tests are mostly standalone scripts; tests/run_all.py runs each
        # one as its own process (pytest-style files under pytest). Laptop-line
        # tests written against code the 2026-10-03 lineage merge did not keep
        # are in legacy/laptop_tests/ and do not run here.
        run: python tests/run_all.py

  # The daily board workflow (daily.yml) already runs the pipeline and commits
  # the CLV log. This job is ONLY the test suite — it never mutates the repo.