name: OLP XDV missed-run watchdog

# daily.yml alerts when a board run FAILS. This catches the silent case: a
# scheduled run GitHub delayed or dropped (2026-09-30: the 06:00 run never
# fired). ~2.5 h after each board slot it checks that some daily.yml run
# succeeded in the slot's window; if none did (and none failed or is still
# going) it starts the slot's board itself and says so on Telegram.
on:
  schedule:
    # A first check ~35 min after each slot (2026-10-09: the board Routine's
    # session hit its usage limit and GitHub's 20:47 cron never fired, so
    # Saturday's board waited for the 23:17 check), then the late check.
    # Slots are UK time (21:47 / 06:47, daylight saving included): 20:47 /
    # 05:47 UTC in BST, 21:47 / 06:47 UTC in GMT. A check that lands before
    # its slot's UK time (winter) does nothing — the next one covers it.
    - cron: "23 21 * * *"   # evening slot, first check (BST)
    - cron: "23 22 * * *"   # evening slot, first check (GMT)
    - cron: "17 23 * * *"   # evening slot, late check
    - cron: "23 6 * * *"    # morning slot, first check (BST)
    - cron: "23 7 * * *"    # morning slot, first check (GMT)
    - cron: "17 8 * * *"    # morning slot, late check
  workflow_dispatch:
    inputs:
      slot:
        description: "evening | morning"
        required: true
        default: "evening"

permissions:
  actions: write    # read daily.yml's runs; start a missed slot's board
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests
      - name: Check the slot's board run
        env:
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          SCHEDULE:           ${{ github.event.schedule }}
          SLOT_INPUT:         ${{ github.event.inputs.slot }}
        run: |
          case "$SCHEDULE" in
            "23 21 * * *"|"23 22 * * *"|"17 23 * * *") SLOT=evening ;;
            "23 6 * * *"|"23 7 * * *"|"17 8 * * *")    SLOT=morning ;;
            *) SLOT="${SLOT_INPUT:-evening}" ;;
          esac
          if ! [[ "$SLOT" =~ ^(evening|morning)$ ]]; then echo "invalid slot '$SLOT'"; exit 1; fi
          python monitor/run_watchdog.py --slot "$SLOT"
