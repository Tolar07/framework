name: OLP XDV board clock

# Starts the 10pm (21:47 UK) and 7am (06:47 UK) board runs ON TIME, on the UK
# clock with daylight saving (Architect 2026-10-15: "UK time for everything")
# (Architect 2026-10-15: "make sure the triggers [are] on time ... I don't want
# it to fail again"). GitHub's crons and the board Routine both fire hours
# late; this ONE job loops all day and starts daily.yml itself the minute a
# slot is due and its board has not been sent (monitor/board_clock.py).
# A job may run 6 hours at most, so the clock hands off to a fresh run.
# The crons below only RESTART the clock if the chain ever breaks — a run that
# finds a clock already going exits at once. daily.yml's duplicate guard
# keeps every other starter (Routine, GitHub cron, watchdog) harmless.
on:
  schedule:
    - cron: "13 */2 * * *"     # restart if the clock died
    - cron: "31 20 * * *"      # and just before each slot (BST)
    - cron: "31 5 * * *"
    - cron: "31 21 * * *"      # (GMT)
    - cron: "31 6 * * *"
  workflow_dispatch:
    inputs:
      handoff:
        description: "true = started by the previous clock run (internal)"
        required: false
        default: "false"

permissions:
  actions: write    # start daily.yml; see / hand off clock runs
  contents: read    # read the sent_<date>_<slot> markers

jobs:
  clock:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start each board run on time
        env:
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          HANDOFF:            ${{ github.event.inputs.handoff }}
        run: |
          if [ "$HANDOFF" = "true" ]; then python3 monitor/board_clock.py --handoff
          else python3 monitor/board_clock.py; fi
