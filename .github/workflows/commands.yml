name: OLP XDV telegram commands

# ONE JOB LOOPS, polling every 5 minutes (monitor/commands_loop.py).
#
# This was hourly, on the belief that anything faster would cost "~2,900
# Actions minutes/month against a 2,000-minute free allowance". That allowance
# does not apply here: Tolar07/framework is PUBLIC, and GitHub-hosted minutes
# are unmetered on public repositories. The same wrong premise had the live
# matchday tracker running in a Claude session instead of Actions until
# 2026-10-14.
#
# And hourly did not even deliver hourly. Measured over the 35 hours to
# 2026-10-14 17:00 UTC, GitHub gave this workflow SIX runs: 13:36, 07:28,
# 01:47, 22:36, 17:31, 09:17. So /board or /status could sit unanswered for
# six hours while this workflow's history showed nothing but green.
on:
  # schedule: none - the Oracle VM clock starts this (matchbook-agent oracle_clock/schedule.json)
  workflow_dispatch:
    inputs:
      handoff:
        description: "true = started by the previous loop run (internal)"
        required: false
        default: "false"

permissions:
  actions: write    # see whether a loop is already running; hand off to a fresh run
  contents: write

# No concurrency group, deliberately: with a loop that runs for hours, queued
# runs would pile up behind it. The single-loop guard in commands_loop.py does
# the job instead - a newer run exits while an older one is going, so two jobs
# never write the CLV log at once. Same as news.yml and nba_watch.yml.

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 355    # a job may run 6 h; the loop hands off at 5 h 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Answer commands every 5 minutes until the job limit
        env:
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          ODDS_API_KEY:       ${{ secrets.ODDS_API_KEY }}
          THESPORTSDB_KEY:    ${{ secrets.THESPORTSDB_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING:   utf-8
          HANDOFF:            ${{ github.event.inputs.handoff }}
        run: |
          git config user.name  "olp-xdv-agent"
          git config user.email "olp-xdv-agent@users.noreply.github.com"
          ARGS=""
          if [ "$HANDOFF" = "true" ]; then ARGS="--handoff"; fi
          python monitor/commands_loop.py $ARGS

      # The loop commits /log's legs, /note's corrections and the read offset
      # right after the round that produced them (monitor/commands_loop.py),
      # so there is no trailing persist step: an answered command must never be
      # answered twice, and that cannot wait for the job to end.
