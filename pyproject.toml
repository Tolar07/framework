# Tooling config only — this is a source-run framework (modules import each
# other via sys.path), not a pip-installable package. Dev tools install with:
#   pip install ruff mypy pytest pytest-cov pre-commit

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "S",   # flake8-bandit (security) — gate-scoped: CI lint runs the closure
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in default args
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106", "S108"]  # tests: assert, subprocess, and throwaway path strings

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.12"
# The codebase is a source-run script framework, mostly untyped. Set the bar at
# a baseline that catches real type bugs in NEW/annotated code without drowning
# the gate in noise from legacy untyped modules (which the daily CI runs first).
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
no_implicit_optional = true
strict_optional = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true
# Gate scope: the data-hardening closure (retry, validation, loader, the
# data-quality monitor, and its engine dependency). The rest of the repo is a
# legacy untyped script framework with hundreds of benign `attr-defined`
# findings; a green gate here catches real regressions in the modules whose
# correctness is load-bearing without forcing a codebase-wide typing refactor.
files = [
    "data/retry.py",
    "data/validation.py",
    "data/football_data_source.py",
    "monitor/data_quality.py",
    "engine/softness.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["."]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]